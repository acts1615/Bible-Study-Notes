<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#7a1f2e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>성경연구노트</title>
<style>

*{box-sizing:border-box}body{transition:background .2s,color .2s}.dark img{filter:brightness(.85)}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
a{color:var(--lk)}.dark a{text-decoration:underline;text-decoration-color:#e3c9a055}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;font-size:14px;padding:4px 8px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px}
button{cursor:pointer}.tg{display:flex;flex-wrap:wrap;gap:4px}.tg label{font-size:13px;border:1px solid var(--bd);border-radius:12px;padding:1px 9px;cursor:pointer;user-select:none}
.tg input{display:none}.tg input:checked+span{color:var(--acc);font-weight:700}.tg label:has(input:checked){border-color:var(--acc)}

h1{font-size:22px;margin:.4em 0}.sec{font-size:17px;font-weight:700;margin:26px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--bd)}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--bd)}
.nomemo{grid-template-columns:1fr}

.tr div{font-size:var(--ft,15px)}.tr small{display:block;color:var(--mut);font-size:11px}.vn{color:var(--acc);font-weight:700;margin-right:6px}
.memo{background:var(--memo);border:1.5px dashed var(--bd);border-radius:12px;padding:8px 12px;font-size:var(--fm,14.5px);min-height:40px}
.memo:empty{display:none}.memo p{margin:.35em 0;word-break:keep-all;overflow-wrap:anywhere}.memo .lb{font-size:11px;font-weight:700;color:#fff;background:var(--acc);border-radius:8px;padding:0 7px;margin-right:4px}.dark .memo .lb{color:#222}.sepia .memo .lb,.sepia .cards .lb,.sepia .mb .lb{color:#fff}
.memo .c{border-left:3px solid var(--acc);padding-left:8px;margin:.5em 0}.memo img{max-width:100%;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.grid a{border:1px solid var(--bd);border-radius:8px;text-align:center;padding:4px;text-decoration:none}.grid a.has{border-color:var(--acc);font-weight:700}
.bl{font-size:14px}.bl a{display:inline-block;margin:2px 6px 2px 0}

.row2,.sec{scroll-margin-top:120px}

.side{font-size:12.5px;border-left:1px solid var(--bd);padding-left:10px}.side small{display:block;color:var(--mut);margin-bottom:2px}.side a{display:block;line-height:1.5;margin:1px 0}
details.md{margin-top:8px}details.md>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--acc);user-select:none}details.md>summary i{font-style:normal;font-weight:400;color:var(--mut)}
details.md .memo{margin-top:6px}
.cards{margin-top:6px}details.mc{background:var(--memo);border:1.5px dashed var(--bd);border-radius:12px;padding:6px 12px;margin:6px 0}
details.mc>summary{cursor:pointer;display:flex;align-items:center;gap:6px;list-style:none;font-size:13px}details.mc>summary::-webkit-details-marker{display:none}

.acts{margin-left:auto;display:flex;gap:4px}.acts button{font-size:12.5px;padding:2px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--card);color:var(--fg);cursor:pointer}.acts button:hover{border-color:var(--acc);color:var(--acc)}.mb{cursor:text}
.mb{font-size:var(--fm,14.5px)}.mb p{margin:.35em 0;word-break:keep-all;overflow-wrap:anywhere}.mb .c{border-left:3px solid var(--acc);padding-left:8px;margin:.5em 0}.mb img{max-width:100%}
.cv{font-size:12.5px;color:var(--mut);margin:4px 0}.addc{margin:6px 0}.addc button{font-size:12.5px}.ef{margin:4px 0}.ef textarea{width:100%;min-height:130px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;font-size:var(--fm,14.5px);resize:vertical;margin-top:6px}.ef .bar input.s{width:150px}
.mb .lb,.cards .lb{font-size:11px;font-weight:700;color:#fff;background:var(--acc);border-radius:8px;padding:0 7px}.dark .cards .lb{color:#222}
.memo{position:relative}.memo .ed{position:absolute;top:4px;right:6px;font-size:12px;padding:0 6px;opacity:.55}.memo:hover .ed{opacity:1}
.empty{border-style:dotted;color:var(--mut);cursor:text;min-height:34px;padding:6px 12px;font-size:13px}
.rg{font-size:11px;font-weight:700;border:1px solid var(--acc);color:var(--acc);border-radius:8px;padding:0 6px;margin-bottom:4px;display:inline-block}
.memo textarea{width:100%;min-height:150px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;font-size:14px;resize:vertical}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px}.bar input[type=number]{width:60px}
.pv{margin-top:6px;font-size:13px;background:var(--bg);border:1px solid var(--acc);border-radius:8px;padding:6px 10px}
header .sz{font-size:12px;color:var(--mut);white-space:nowrap}header .sz button{padding:2px 7px}#st{font-size:12px;color:var(--mut)}.ok{color:#2a8a4a!important}
@media(max-width:800px){.row2{grid-template-columns:1fr!important}.side{border-left:0!important;padding-left:0!important}.row{grid-template-columns:1fr}.tr{grid-template-columns:1fr}}
@media print{header,.noprint{display:none}.memo{break-inside:avoid}}

#app{display:flex;min-height:100vh}
#sb{width:272px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--bd);padding:0 14px 20px;font-size:14px}
body.sbc #sb{display:none}
.sbh{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);padding:12px 0 8px;z-index:2}.sbh b{font-size:17px;color:var(--acc)}
#sb section{padding:10px 0;border-bottom:1px solid var(--bd)}#sb section:last-child{border:0}
#sb h4{margin:0 0 7px;font-size:12px;letter-spacing:.04em;color:var(--mut);font-weight:700}
#sb button,#sb select{font-size:13.5px}#sb .wide{width:100%;margin-top:6px;padding:6px 8px}
.r2{display:flex;gap:6px;margin-bottom:6px}.r2>*{flex:1;min-width:0}
.lab{font-size:12px;color:var(--mut);margin:8px 0 4px}
.sw{display:flex;flex-wrap:wrap;align-items:center;gap:6px;cursor:pointer}.sw small{flex-basis:100%;color:var(--mut);font-size:11.5px;margin-left:22px}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.seg button{flex:1;border:0;border-radius:0;background:var(--bg);padding:6px 2px;font-size:13px}.seg button+button{border-left:1px solid var(--bd)}

#sb .tg{display:flex;flex-wrap:wrap;gap:5px}#sb .tg label{font-size:12.5px;padding:2px 10px;background:var(--bg)}

#st{display:block;margin-top:4px}
#wrap{flex:1;min-width:0}
#top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--bd);padding:7px 14px;box-shadow:0 1px 6px #0000000d}
#loc{padding-left:10px;border-left:5px solid var(--acc);flex:1;min-width:0;overflow:hidden}#lt{font-size:21px;font-weight:800;color:var(--fg);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#lbc{font-size:11.5px;color:var(--mut);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#lbc:empty{display:none}#lbc a{color:var(--mut);text-decoration:none;padding:1px 2px;border-radius:4px}#lbc a:hover{color:var(--acc);text-decoration:underline}#lbc i{font-style:normal;margin:0 2px;opacity:.6}

.sec{color:var(--acc);border-bottom:1.5px solid var(--bd)}
.mk{margin-left:5px;font-size:11.5px;font-weight:700;padding:0 7px;border-radius:10px;background:var(--acc);color:#fff;border:0;cursor:pointer;vertical-align:1px}.dark .mk{color:#222}
.row2.hasm{border-left:4px solid var(--acc);padding-left:12px;background:linear-gradient(90deg,#00000008,transparent 40%)}
.row2.sd{grid-template-columns:minmax(0,1fr) minmax(290px,38%)}.row2.sd .side{font-size:13px}.row2.sd .side details.md{margin:0 0 10px}.side details.md a{display:inline;margin:0}.side details.md .mb p{margin:.4em 0}
.row2,.sec{scroll-margin-top:80px}

.bc{font-size:12.5px;color:var(--mut);margin:0 0 4px}.bc a{color:var(--mut);text-decoration:none;padding:1px 2px;border-radius:4px}.bc a:hover{color:var(--acc);text-decoration:underline}.bc i{font-style:normal;margin:0 3px;opacity:.6}.bc b{color:var(--fg);font-weight:600}

.gt{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mut);margin:16px 2px 6px}
.card2{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}
.bk+.bk{border-top:1px solid var(--bd)}.bk.open{background:var(--memo)}

body.nt,.nt{--acc:#005A9C;--lk:#005A9C}.dark.nt,.dark .nt{--acc:#7fbbe9;--lk:#7fbbe9}

.vl{display:flex;gap:10px;align-items:flex-start}.vc{flex:none;width:3.4em;display:flex;flex-direction:column;align-items:flex-end;gap:3px;border-right:2px solid var(--bd);padding-right:8px}

<div id="app">
<aside id="sb">
 <div class="sbh"><b>성경연구노트</b><small id="ver" style="color:var(--mut);font-size:11.5px;margin-left:6px"></small><button id="sbx" title="사이드바 닫기">«</button></div>
 <section><h4>위치</h4>

  <div class="r2"><button id="pv">◀ 이전 장</button><button id="nx">다음 장 ▶</button></div>
